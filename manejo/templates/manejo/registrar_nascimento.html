{% extends "base.html" %}

{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold"><i class="fas fa-baby text-warning me-2"></i>Registrar Nascimento</h3>
        <a href="{% url 'paricoes_list' %}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form method="post" novalidate>
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-bold text-secondary">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">
                                {{ field.errors|striptags }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-warning text-dark fw-bold">
                        <i class="fas fa-check-circle me-1"></i> Salvar Registro e Cadastrar Bezerro
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
